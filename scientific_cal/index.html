<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <!-- Display Screen -->
        <input type="text" id="display" readonly placeholder="0">
        
        <!-- Buttons Grid -->
        <div class="buttons">
            <!-- Row 1: Clear and Backspace -->
            <button class="btn clear" onclick="clearDisplay()">C</button>
            <button class="btn backspace" onclick="backspace()">&larr;</button>
            <button class="btn operator" onclick="appendOperator('(')">(</button>
            <button class="btn operator" onclick="appendOperator(')')">)</button>
      
            <button class="btn scientific" onclick="calculateSci('sin')">sin</button>
            <button class="btn scientific" onclick="calculateSci('cos')">cos</button>
            <button class="btn scientific" onclick="calculateSci('tan')">tan</button>
            <button class="btn scientific" onclick="calculateSci('sqrt')">&radic;</button>

            <button class="btn scientific" onclick="calculateSci('log')">log</button>
            <button class="btn scientific" onclick="calculateSci('ln')">ln</button>
            <button class="btn operator" onclick="appendOperator('**')">x&sup2;</button>
            <button class="btn operator" onclick="appendOperator('/')">&divide;</button>

            <button class="btn number" onclick="appendNumber('7')">7</button>
            <button class="btn number" onclick="appendNumber('8')">8</button>
            <button class="btn number" onclick="appendNumber('9')">9</button>
            <button class="btn operator" onclick="appendOperator('*')">&times;</button>
            
            <!-- Row 5: Digits and Operators -->
            <button class="btn number" onclick="appendNumber('4')">4</button>
            <button class="btn number" onclick="appendNumber('5')">5</button>
            <button class="btn number" onclick="appendNumber('6')">6</button>
            <button class="btn operator" onclick="appendOperator('-')">&minus;</button>
            
            <!-- Row 6: Digits and Operators -->
            <button class="btn number" onclick="appendNumber('1')">1</button>
            <button class="btn number" onclick="appendNumber('2')">2</button>
            <button class="btn number" onclick="appendNumber('3')">3</button>
            <button class="btn operator" onclick="appendOperator('+')">+</button>
            
            <!-- Row 7: Constants & Equals -->
            <button class="btn scientific" onclick="appendNumber('Math.PI')">&pi;</button>
            <button class="btn number" onclick="appendNumber('0')">0</button>
            <button class="btn number" onclick="appendNumber('.')">.</button>
            <button class="btn equal" onclick="calculateResult()">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
